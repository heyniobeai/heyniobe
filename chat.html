<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIOBE</title>
<style>
:root{
  --bg:#111319; --surface:#1b1f28; --raise:#2a2f3b;
  --gold:#EBC77C; --gold-br:#FBE3A8; --gold-dim:#b08e4e;
  --ink:#F8F4EC; --ink-soft:#DDD5C4; --mut:#ABA593;
  --line:rgba(216,184,120,.16); --radius:14px;
  --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono','IBM Plex Mono',Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#f4f1e8; --surface:#fffdf7; --raise:#fbf7ec; --gold:#9a7327; --gold-br:#7c5c1c;
  --gold-dim:#b79b63; --ink:#1d1a14; --ink-soft:#3b352a; --mut:#6b6152; --line:rgba(120,95,40,.2);
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f1e8; --surface:#fffdf7; --raise:#fbf7ec; --gold:#9a7327; --gold-br:#7c5c1c;
  --gold-dim:#b79b63; --ink:#1d1a14; --ink-soft:#3b352a; --mut:#6b6152; --line:rgba(120,95,40,.2);}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.hidden{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;gap:.14em}
.brand span{font-size:15px;letter-spacing:.18em;font-weight:600;color:var(--gold)}
.bar-r{display:flex;align-items:center;gap:9px}
.who{font-family:var(--mono);font-size:11px;color:var(--mut)}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;
  padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
.ghost:hover{border-color:var(--gold-dim);color:var(--ink)}
#log{flex:1 1 auto;overflow-y:auto;padding:26px 20px 8px}
.wrap{max-width:760px;margin:0 auto}
.turn{margin:0 0 20px;display:flex;gap:12px}
.turn .av{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;margin-top:2px}
.turn.me .av{background:var(--raise);color:var(--mut);border:1px solid var(--line)}
.turn.ai .av{background:linear-gradient(180deg,var(--gold-br),var(--gold));color:#20180a;font-weight:700}
.turn .body{flex:1 1 auto;min-width:0}
.turn .body p{margin:0 0 10px;line-height:1.66;font-size:16.5px;white-space:pre-wrap;word-wrap:break-word}
.turn.me .body p{color:var(--ink-soft)}
.empty{color:var(--mut);text-align:center;padding:56px 10px}
.empty h2{font-size:23px;color:var(--ink);margin:0 0 8px}
.empty p{margin:0 0 20px;line-height:1.6}
.seeds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seed{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px}
.seed:hover{border-color:var(--gold-dim);color:var(--ink)}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);
  margin-right:4px;animation:bl 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg);padding:14px 20px 20px}
.cwrap{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-height:52px;max-height:190px;padding:14px 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  font-size:16px;line-height:1.5;resize:none}
textarea:focus{outline:none;border-color:var(--gold-dim);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 14%,transparent)}
.send{padding:14px 20px;border-radius:12px;border:none;cursor:pointer;font:inherit;font-size:15px;
  font-weight:600;background:linear-gradient(180deg,var(--gold-br),var(--gold));color:#20180a}
.send[disabled]{opacity:.5;cursor:not-allowed}
.err{max-width:760px;margin:0 auto 10px;padding:10px 13px;border-radius:9px;font-size:13.5px;
  background:rgba(190,80,70,.12);border:1px solid rgba(190,80,70,.35);color:#e8b6b0;display:none}
.err.on{display:block}
:root[data-theme="light"] .err{color:#8c2f24}
.hint{max-width:760px;margin:8px auto 0;color:var(--mut);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand" aria-label="NIOBE"><span>N</span><span>I</span><span>O</span><span>B</span><span>E</span></div>
  <div class="bar-r">
    <span class="who" id="who"></span>
    <button class="ghost" id="tt" aria-label="Toggle theme">☾</button>
    <button class="ghost" id="out">Sign out</button>
  </div>
</div>

<div id="log">
  <div class="wrap" id="stream">
    <div class="empty" id="empty">
      <h2 id="greet">Niobe is listening.</h2>
      <p>It read your onboarding. Ask it something real.</p>
      <div class="seeds">
        <button class="seed">What should I focus on today?</button>
        <button class="seed">Talk me through a decision I'm stuck on.</button>
        <button class="seed">What do you already know about me?</button>
      </div>
    </div>
  </div>
</div>

<div class="composer">
  <div class="err" id="err"></div>
  <div class="cwrap">
    <textarea id="in" rows="1" placeholder="Say something…" aria-label="Message"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <p class="hint">Enter sends · Shift+Enter for a new line</p>
</div>

<script>
const SUPA="https://gcryyyfepikdkjkgshcl.supabase.co";
const KEY="sb_publishable_iasBF-GV38T2STJJYiwAVg_ia8EMRMr";
const $=id=>document.getElementById(id);
let TOKEN=null,HISTORY=[],BUSY=false;

/* theme */
const root=document.documentElement;
let sv=null;try{sv=localStorage.getItem('niobe-theme')}catch(e){}
if(sv)root.setAttribute('data-theme',sv);
const icon=()=>{const d=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');$('tt').textContent=d==='light'?'☀':'☾'};
icon();
$('tt').onclick=()=>{const c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
  const n=c==='light'?'dark':'light';root.setAttribute('data-theme',n);try{localStorage.setItem('niobe-theme',n)}catch(e){}icon()};
$('out').onclick=()=>{try{localStorage.removeItem('niobe-token')}catch(e){};location.href='/login'};

function bubble(role,text){
  $('empty')?.remove();
  const t=document.createElement('div'); t.className='turn '+(role==='user'?'me':'ai');
  const av=document.createElement('div'); av.className='av'; av.textContent=role==='user'?'YOU':'N';
  const b=document.createElement('div'); b.className='body';
  String(text).split(/\n{2,}/).forEach(par=>{const p=document.createElement('p');p.textContent=par;b.appendChild(p)});
  t.appendChild(av); t.appendChild(b); $('stream').appendChild(t);
  $('log').scrollTop=$('log').scrollHeight; return b;
}
function fail(m){$('err').textContent=m;$('err').className='err on'}
function clearFail(){$('err').className='err'}

async function send(text){
  if(BUSY)return; const msg=(text??$('in').value).trim(); if(!msg)return;
  clearFail(); BUSY=true; $('send').disabled=true;
  bubble('user',msg); $('in').value=''; $('in').style.height='auto';
  const think=bubble('assistant',''); think.innerHTML='<p class="dots"><span></span><span></span><span></span></p>';
  try{
    const r=await fetch('/api/chat',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({message:msg,history:HISTORY})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      think.parentElement.remove();
      if(r.status===401){fail('Session expired. Sign in again.');setTimeout(()=>location.href='/login',1400)}
      else if(r.status===409){fail(d.detail||d.error||'Your instance isn\'t ready yet.')}
      else fail(d.error||'That failed. Nothing was sent.');
    }else{
      think.innerHTML=''; String(d.reply).split(/\n{2,}/).forEach(par=>{const p=document.createElement('p');p.textContent=par;think.appendChild(p)});
      HISTORY.push({role:'user',content:msg},{role:'assistant',content:d.reply});
      if(HISTORY.length>20)HISTORY=HISTORY.slice(-20);
      $('log').scrollTop=$('log').scrollHeight;
    }
  }catch(e){think.parentElement.remove();fail('Network error. Nothing was sent.')}
  BUSY=false;$('send').disabled=false;$('in').focus();
}

$('send').onclick=()=>send();
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,190)+'px'});
document.addEventListener('click',e=>{if(e.target.classList.contains('seed'))send(e.target.textContent)});

(async function(){
  const h=new URLSearchParams(location.hash.slice(1));
  const at=h.get('access_token');
  if(at){try{localStorage.setItem('niobe-token',at)}catch(e){}history.replaceState(null,'',location.pathname)}
  try{TOKEN=at||localStorage.getItem('niobe-token')}catch(e){}
  if(!TOKEN){location.href='/login';return}
  const r=await fetch(`${SUPA}/auth/v1/user`,{headers:{apikey:KEY,Authorization:'Bearer '+TOKEN}});
  if(!r.ok){try{localStorage.removeItem('niobe-token')}catch(e){};location.href='/login';return}
  const u=await r.json(); $('who').textContent=u.email||'';
  const md=u.user_metadata||{};
  if(!md.niobe_brain){
    const ob=md.onboarding||{};
    $('greet').textContent='Your Niobe is still being built.';
    $('empty').querySelector('p').textContent = (ob.i>0)
      ? `You're ${ob.i} questions in. Finish the audit and your instance gets built within 15 minutes.`
      : 'Start with the onboarding audit — Niobe is built from those answers.';
    $('empty').querySelector('.seeds').innerHTML='<a class="seed" href="/app" style="text-decoration:none">Go to the audit</a>';
    $('in').disabled=true;$('send').disabled=true;$('in').placeholder='Available once your instance is built.';
    return;
  }
  const nm=(md.niobe_brain.operator||'').split(' ')[0];
  if(nm)$('greet').textContent=`Niobe is listening, ${nm}.`;
  $('in').focus();
})();
</script>
</body>
</html>
